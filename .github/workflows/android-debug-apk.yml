name: Build Ammar Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, ammar-ui-drag-fix]

permissions:
  contents: read

concurrency:
  group: ammar-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools"; the legacy "tools" package no
          # longer exists in the SDK repository, so it must not be requested.
          packages: ''

      - name: Install Android SDK packages
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          else
            echo "sdkmanager is not on PATH, relying on the preinstalled SDK"
          fi
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls "${ANDROID_HOME}/platforms" || true

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Validate web assets and plugin contract
        run: npm run validate

      - name: Test web bridge
        run: npm test

      - name: Prepare Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ already present, reusing it"
          fi

      - name: Integrate Ammar native plugin
        run: node scripts/patch-android.mjs

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh android/app/build/outputs/apk/debug/
          sha256sum "$APK"

      - name: Show build log tail on failure
        if: failure()
        run: tail -n 150 build.log || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ammar-build-logs
          path: |
            build.log
            android/app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ammar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
