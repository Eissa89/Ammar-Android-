<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1c2c">
    <meta name="description" content="Ammar — رفيقك التفاعلي العائم">
    <link rel="manifest" href="manifest.webmanifest">
    <title>Ammar - رفيقك الذكي</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(145deg, #101827 0%, #263449 55%, #432b43 100%);
            --bubble-bg: #f8fafc;
            --bubble-text: #172033;
            --accent-color: #d6a85f;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
        }

        html { background: transparent; }

        body.android-overlay {
            background: transparent !important;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #f8fafc;
        }

        /* Compact glass surface for the floating companion. */
        #ammar-stage {
            position: relative;
            width: 184px;
            height: 244px;
            padding: 34px 12px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            border: 1px solid rgba(226, 232, 240, 0.20);
            border-radius: 28px;
            background:
                radial-gradient(circle at 50% 32%, rgba(214, 168, 95, 0.16), transparent 46%),
                linear-gradient(155deg, rgba(30, 41, 59, 0.94), rgba(15, 23, 42, 0.88));
            box-shadow: 0 16px 38px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255,255,255,0.10);
            backdrop-filter: blur(16px);
            cursor: default;
            touch-action: pan-y;
            overflow: visible;
        }

        #drag-handle {
            position: absolute;
            top: 9px;
            left: 50%;
            transform: translateX(-50%);
            width: 58px;
            height: 19px;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.72);
            font-size: 9px;
            line-height: 17px;
            letter-spacing: 0.3px;
            text-align: center;
            pointer-events: none;
        }

        #ammar-character {
            display: block;
            width: 132px;
            height: 150px;
            flex: 0 0 auto;
            filter: drop-shadow(0 8px 9px rgba(0,0,0,0.22));
            transform-origin: center bottom;
        }

        /* فقاعة الكلام */
        #speech-bubble {
            position: absolute;
            top: 34px;
            left: 8px;
            right: 8px;
            margin: auto;
            width: max-content;
            background: var(--bubble-bg);
            color: var(--bubble-text);
            padding: 9px 13px;
            border: 1px solid rgba(255,255,255,0.65);
            border-radius: 16px;
            font-size: 12px;
            line-height: 1.45;
            font-weight: 650;
            max-width: 168px;
            text-align: center;
            box-shadow: var(--shadow);
            opacity: 0;
            transform: translateY(8px) scale(0.94);
            transition: all 0.24s ease;
            pointer-events: none;
            z-index: 10;
        }

        #speech-bubble.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: var(--bubble-bg) transparent transparent;
        }

        /* شارة الاسم */
        .name-badge {
            background: rgba(214, 168, 95, 0.14);
            padding: 5px 15px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-top: 4px;
            border: 1px solid rgba(214, 168, 95, 0.42);
            color: #f4d9a7;
        }

        body.android-overlay .name-badge {
            background: rgba(214, 168, 95, 0.14);
        }

        /* لوحة التحكم (تختفي تلقائياً في وضع الأندرويد العائم) */
        .controls {
            position: fixed;
            bottom: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 92vw;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }

        body.android-overlay .controls {
            display: none;
        }

        button {
            background: var(--accent-color);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s, background 0.2s;
        }

        button:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        /* حركات الشخصية */
        @keyframes floatIdle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes happyBounce {
            0%, 100% { transform: scale(1, 1) translateY(0); }
            30% { transform: scale(1.1, 0.9) translateY(5px); }
            60% { transform: scale(0.95, 1.05) translateY(-18px); }
        }

        .idle-anim {
            animation: floatIdle 3s ease-in-out infinite;
        }

        .jump-anim {
            animation: happyBounce 0.6s ease;
        }

        /* حركة المشي والتمايل */
        @keyframes walkWobble {
            0%, 100% { transform: rotate(-4deg) translateY(0px); }
            50% { transform: rotate(4deg) translateY(-5px); }
        }

        .walk-anim {
            animation: walkWobble 0.45s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <div id="ammar-stage" title="Ammar">
        <div id="drag-handle" aria-hidden="true">اسحب للتحريك</div>
        <div id="speech-bubble">أهلاً! أنا Ammar</div>

        <!-- رسم الشخصية باستخدام SVG متجهي عالي الدقة وقابل للتحريك -->
        <svg id="ammar-character" class="idle-anim" width="160" height="180" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
            <!-- الظل السفلي -->
            <ellipse cx="100" cy="205" rx="45" ry="10" fill="rgba(0,0,0,0.25)"/>

            <!-- الجسم -->
            <rect x="60" y="115" width="80" height="75" rx="35" fill="#3b82f6"/>
            <path d="M75 115 L125 115 L115 155 L85 155 Z" fill="#60a5fa"/>

            <!-- الذراع الأيسر -->
            <g id="left-arm">
                <rect x="38" y="125" width="22" height="50" rx="11" fill="#2563eb" transform="rotate(15 49 125)"/>
            </g>

            <!-- الذراع الأيمن (يلوح) -->
            <g id="right-arm">
                <rect x="140" y="125" width="22" height="50" rx="11" fill="#2563eb" transform="rotate(-15 151 125)"/>
            </g>

            <!-- الرأس -->
            <circle cx="100" cy="75" r="52" fill="#fde68a"/>

            <!-- الشعر (ستايل عصري لشخصية Ammar) -->
            <path d="M48 70 C48 30, 152 30, 152 70 C152 50, 130 40, 100 42 C70 40, 48 50, 48 70 Z" fill="#1e293b"/>
            <path d="M65 42 Q100 15 135 42 Q115 35 100 38 Q85 35 65 42 Z" fill="#1e293b"/>

            <!-- العيون -->
            <g id="eyes">
                <circle cx="80" cy="75" r="7" fill="#1e293b"/>
                <circle cx="82" cy="73" r="2.5" fill="#ffffff"/>

                <circle cx="120" cy="75" r="7" fill="#1e293b"/>
                <circle cx="122" cy="73" r="2.5" fill="#ffffff"/>
            </g>

            <!-- الخدود -->
            <ellipse cx="68" cy="88" rx="7" ry="4" fill="#fca5a5" opacity="0.7"/>
            <ellipse cx="132" cy="88" rx="7" ry="4" fill="#fca5a5" opacity="0.7"/>

            <!-- الفم -->
            <path id="mouth" d="M88 94 Q100 106 112 94" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none"/>
        </svg>

        <div class="name-badge">AMMAR</div>
    </div>

    <!-- أزرار التحكم للتجربة على المتصفح -->
    <div class="controls">
        <button onclick="AmmarApp.talk()">تحدث مع Ammar</button>
        <button onclick="AmmarApp.jump()">اقفز</button>
        <button onclick="AmmarApp.toggleWalk()">تفعيل/إيقاف التجول</button>
        <button onclick="AmmarApp.launchAndroidOverlay()">إظهار Ammar فوق التطبيقات</button>
        <button onclick="AmmarApp.hideAndroidOverlay()">إخفاء Ammar</button>
        <button onclick="AmmarApp.toggleOverlayMode()">معاينة وضع الأندرويد</button>
    </div>

    <!-- Capacitor core (browser build). Copied from @capacitor/core by scripts/sync-vendor.mjs. -->
    <script src="vendor/capacitor.js"></script>
    <script>
        /**
         * Ammar native bridge.
         *
         * Resolution order, so the page works in every Capacitor configuration:
         * 1. Capacitor.registerPlugin() from @capacitor/core (official API).
         * 2. Capacitor.Plugins, for setups that pre-register plugin proxies.
         * 3. Capacitor.nativePromise, the transport registerPlugin itself uses.
         * The floating WebView is a plain WebView (no Capacitor bridge), so it talks
         * to native through the AndroidBridge JavaScript interface instead.
         */
        const AmmarNative = (() => {
            const PLUGIN_NAME = 'AmmarOverlay';
            const MAX_STEP = 240;

            let plugin = null;
            let probed = false;

            function isOverlayWebView() {
                return !!(window.AndroidBridge && typeof window.AndroidBridge.moveBy === 'function');
            }

            function wrapNativePromise(capacitor) {
                const invoke = (method, options) => capacitor.nativePromise(PLUGIN_NAME, method, options || {});
                return {
                    checkOverlayPermission: () => invoke('checkOverlayPermission'),
                    requestOverlayPermission: () => invoke('requestOverlayPermission'),
                    showAmmar: (options) => invoke('showAmmar', options),
                    hideAmmar: () => invoke('hideAmmar'),
                    moveBy: (options) => invoke('moveBy', options),
                    onAmmarClicked: () => invoke('onAmmarClicked')
                };
            }

            function resolvePlugin() {
                if (probed) return plugin;
                probed = true;
                const capacitor = window.Capacitor;
                if (!capacitor) return null;
                try {
                    if (typeof capacitor.isNativePlatform === 'function' && !capacitor.isNativePlatform()) {
                        return null;
                    }
                    if (typeof capacitor.registerPlugin === 'function') {
                        plugin = capacitor.registerPlugin(PLUGIN_NAME);
                    } else if (capacitor.Plugins && capacitor.Plugins[PLUGIN_NAME]) {
                        plugin = capacitor.Plugins[PLUGIN_NAME];
                    } else if (typeof capacitor.nativePromise === 'function') {
                        plugin = wrapNativePromise(capacitor);
                    }
                } catch (error) {
                    console.warn('Ammar: Capacitor plugin lookup failed', error);
                    plugin = null;
                }
                return plugin;
            }

            function clampStep(value) {
                const number = Number(value);
                if (!Number.isFinite(number)) return 0;
                return Math.max(-MAX_STEP, Math.min(MAX_STEP, number));
            }

            return {
                isOverlayWebView,
                isAvailable() {
                    return isOverlayWebView() || !!resolvePlugin();
                },
                async checkOverlayPermission() {
                    if (isOverlayWebView()) return { granted: true };
                    const target = resolvePlugin();
                    if (!target) return { granted: false, unsupported: true };
                    return target.checkOverlayPermission();
                },
                async requestOverlayPermission() {
                    const target = resolvePlugin();
                    if (!target) return { granted: false, unsupported: true };
                    return target.requestOverlayPermission();
                },
                async show(text) {
                    const target = resolvePlugin();
                    if (!target) return { showing: false, unsupported: true };
                    return target.showAmmar(text ? { text } : {});
                },
                async hide() {
                    const target = resolvePlugin();
                    if (!target) return { showing: false, unsupported: true };
                    return target.hideAmmar();
                },
                async moveBy(dx, dy) {
                    const stepX = clampStep(dx);
                    const stepY = clampStep(dy);
                    if (isOverlayWebView()) {
                        window.AndroidBridge.moveBy(stepX, stepY);
                        return { moved: true, transport: 'javascript-interface' };
                    }
                    const target = resolvePlugin();
                    if (!target) return { moved: false, transport: 'none' };
                    return target.moveBy({ dx: stepX, dy: stepY });
                },
                async notifyClick() {
                    if (isOverlayWebView()) {
                        window.AndroidBridge.onAmmarClicked();
                        return;
                    }
                    const target = resolvePlugin();
                    if (target) await target.onAmmarClicked();
                }
            };
        })();

        /**
         * وحدة التحكم الرئيسية لشخصية Ammar (النسخة الأولى MVP)
         * تدعم: الحركة الذاتية، السحب باللمس، وفقاعة الكلام، والتواصل مع EasyWindow
         */
        const AmmarApp = (() => {
            const lines = [
                "أهلاً بك! أنا Ammar، كيف يمكنني مساعدتك اليوم؟",
                "أنا أتجول على شاشتك الآن! 🚶‍♂️",
                "اسحبني بإصبعك إلى أي مكان تريده.",
                "يوم جميل للإنجاز والإبداع!",
                "لا تنسَ شرب الماء وأخذ قسط من الراحة 😊"
            ];

            const stage = document.getElementById('ammar-stage');
            const character = document.getElementById('ammar-character');
            const bubble = document.getElementById('speech-bubble');
            const mouth = document.getElementById('mouth');
            const eyes = document.getElementById('eyes');

            const params = new URLSearchParams(window.location.search);
            const overlayMode = params.get('mode') === 'android' ||
                navigator.userAgent.includes('AmmarAndroidApp');

            let bubbleTimeout = null;
            let isWalking = true;
            let walkDirection = 1; // 1 لليمين، -1 لليسار
            let suppressNextClick = false;

            function initEnvironment() {
                if (overlayMode) {
                    document.body.classList.add('android-overlay');
                }
            }

            function talk(customText = null) {
                const text = typeof customText === 'string' && customText.trim()
                    ? customText
                    : lines[Math.floor(Math.random() * lines.length)];
                bubble.textContent = text;
                bubble.classList.add('visible');

                mouth.setAttribute('d', 'M88 92 Q100 112 112 92 Z');
                setTimeout(() => {
                    mouth.setAttribute('d', 'M88 94 Q100 106 112 94');
                }, 400);

                clearTimeout(bubbleTimeout);
                bubbleTimeout = setTimeout(() => {
                    bubble.classList.remove('visible');
                }, 3500);
            }

            function jump() {
                character.classList.remove('idle-anim', 'walk-anim', 'jump-anim');
                void character.offsetWidth;
                character.classList.add('jump-anim');

                setTimeout(() => {
                    character.classList.remove('jump-anim');
                    character.classList.add(isWalking ? 'walk-anim' : 'idle-anim');
                }, 600);
            }

            // محرك الحركة الذاتية: يحرك النافذة العائمة في الأندرويد ويحدّ الأطراف في الطبقة الأصلية
            function startAutonomousBehavior() {
                setInterval(() => {
                    if (!isWalking) return;

                    // تغيير الاتجاه عشوائياً أو التوقف للراحة
                    if (Math.random() < 0.25) {
                        character.classList.remove('walk-anim');
                        character.classList.add('idle-anim');
                        return;
                    }

                    character.classList.remove('idle-anim');
                    character.classList.add('walk-anim');

                    if (Math.random() < 0.3) walkDirection *= -1;

                    // قلب اتجاه النظر للشخصية
                    character.style.transform = `scaleX(${walkDirection})`;

                    // The overlay window is user-positioned. Keep character animation,
                    // but never move the native window automatically while the user is using it.
                }, 1200);

                // كلام عشوائي كل 15 ثانية
                setInterval(() => {
                    if (Math.random() < 0.4) talk();
                }, 15000);
            }

            function toggleWalk() {
                isWalking = !isWalking;
                character.classList.remove('walk-anim', 'idle-anim');
                character.classList.add(isWalking ? 'walk-anim' : 'idle-anim');
                talk(isWalking ? "عدتُ للتجول! 🏃‍♂️" : "سأستريح هنا قليلاً 🧘‍♂️");
            }

            function startBlinking() {
                setInterval(() => {
                    eyes.style.transform = 'scaleY(0.1)';
                    eyes.style.transformOrigin = 'center 75px';
                    setTimeout(() => {
                        eyes.style.transform = 'scaleY(1)';
                    }, 150);
                }, 4000);
            }

            // في المتصفح نحرك الشخصية داخل الصفحة؛ داخل النافذة العائمة يتولى EasyWindow السحب.
            function enablePreviewDrag() {
                if (overlayMode) return;
                let dragging = false;
                let moved = false;
                let startX = 0;
                let startY = 0;
                let baseX = 0;
                let baseY = 0;

                stage.addEventListener('pointerdown', (event) => {
                    if (event.button !== undefined && event.button !== 0) return;
                    dragging = true;
                    moved = false;
                    startX = event.clientX;
                    startY = event.clientY;
                    baseX = Number(stage.dataset.dragX || 0);
                    baseY = Number(stage.dataset.dragY || 0);
                });

                stage.addEventListener('pointermove', (event) => {
                    if (!dragging) return;
                    const dx = event.clientX - startX;
                    const dy = event.clientY - startY;
                    if (!moved && Math.abs(dx) + Math.abs(dy) < 6) return;
                    moved = true;
                    baseX += dx;
                    baseY += dy;
                    startX = event.clientX;
                    startY = event.clientY;
                    stage.dataset.dragX = String(baseX);
                    stage.dataset.dragY = String(baseY);
                    stage.style.transform = `translate(${baseX}px, ${baseY}px)`;
                });

                const stop = () => {
                    if (dragging && moved) suppressNextClick = true;
                    dragging = false;
                };
                stage.addEventListener('pointerup', stop);
                stage.addEventListener('pointercancel', stop);
                stage.addEventListener('pointerleave', stop);
            }

            async function launchAndroidOverlay() {
                if (!AmmarNative.isAvailable()) {
                    talk("تشغيل Ammar فوق التطبيقات يتطلب تثبيت نسخة Android.");
                    return;
                }
                try {
                    let permission = await AmmarNative.checkOverlayPermission();
                    if (!permission || !permission.granted) {
                        permission = await AmmarNative.requestOverlayPermission();
                    }
                    if (!permission || !permission.granted) {
                        talk("اسمح لـ Ammar بالظهور فوق التطبيقات من إعدادات Android، ثم اضغط الزر مرة أخرى.");
                        return;
                    }
                    const state = await AmmarNative.show("أصبحتُ ظاهرًا فوق التطبيقات.");
                    talk(state && state.showing === false
                        ? "تعذر إظهار النافذة العائمة. تحقق من صلاحية الظهور فوق التطبيقات."
                        : "أصبحتُ ظاهرًا فوق التطبيقات.");
                } catch (error) {
                    console.error("Ammar overlay error:", error);
                    talk("تعذر تشغيل النافذة العائمة. تحقق من صلاحية الظهور فوق التطبيقات.");
                }
            }

            async function hideAndroidOverlay() {
                try {
                    await AmmarNative.hide();
                    talk("تم إخفائي من فوق التطبيقات.");
                } catch (error) {
                    console.error("Ammar overlay hide error:", error);
                    talk("تعذر إخفاء النافذة العائمة.");
                }
            }

            function toggleOverlayMode() {
                document.body.classList.toggle('android-overlay');
            }

            async function autoLaunchOverlayWhenAllowed() {
                if (overlayMode || !AmmarNative.isAvailable()) return;
                try {
                    const permission = await AmmarNative.checkOverlayPermission();
                    if (permission && permission.granted) {
                        await AmmarNative.show("مرحباً! أنا Ammar فوق شاشتك.");
                    } else if (permission && !permission.unsupported) {
                        talk("امنحني صلاحية الظهور فوق التطبيقات من الزر المخصص.");
                    }
                } catch (error) {
                    console.error("Ammar overlay auto launch error:", error);
                }
            }

            stage.addEventListener('click', () => {
                if (suppressNextClick) {
                    suppressNextClick = false;
                    return;
                }
                jump();
                talk();
                AmmarNative.notifyClick().catch((error) => {
                    console.warn('Ammar: click notify failed', error);
                });
            });

            // نقطة الاتصال التي يستدعيها الـ Native عبر evaluateJavascript.
            window.AmmarOverlay = {
                jump,
                say: (text) => talk(text),
                talk: (text) => talk(text),
                moveBy: (dx, dy) => AmmarNative.moveBy(dx, dy),
                hide: () => AmmarNative.hide()
            };

            initEnvironment();
            startBlinking();
            startAutonomousBehavior();
            enablePreviewDrag();
            setTimeout(() => talk(overlayMode ? "أنا هنا فوق شاشتك! 👋" : "مرحباً! أنا Ammar جاهز للعمل."), 800);
            setTimeout(autoLaunchOverlayWhenAllowed, 1200);

            return {
                talk,
                jump,
                toggleWalk,
                toggleOverlayMode,
                launchAndroidOverlay,
                hideAndroidOverlay,
                moveBy: (dx, dy) => AmmarNative.moveBy(dx, dy),
                isOverlayMode: () => overlayMode
            };
        })();
    </script>

<script>
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
  }
</script>
</body>
</html>
